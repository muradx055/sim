function zonesFor(eq, x, h){
  var sd = xSide(eq, x), od = sd === 'L' ? 'R' : 'L', top = eq[sd], O = eq[od], Z = [], rest, Lr;
  function E(a, b, mid){ var r = {}; r[sd] = a; r[od] = b; if (mid) r.mid = true; return r; }

    mk(E(Lr, DIV(O, h)), true, 'facOK'); mk(E(Lr, MUL([O, h])), false, 'facMul'); mk(E(Lr, SUB(O, h)), false, 'facSub');
